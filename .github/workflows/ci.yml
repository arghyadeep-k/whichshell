name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Syntax-check install.sh
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Smoke test whichshell
        if: runner.os != 'Windows'
        run: |
          chmod +x whichshell
          ./whichshell

      - name: Install via install.sh
        if: runner.os != 'Windows'
        run: |
          chmod +x install.sh
          WHICHSHELL_INSTALL_DIR="$RUNNER_TEMP/bin" ./install.sh
          "$RUNNER_TEMP/bin/whichshell"

      - name: Smoke test whichshell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python whichshell

      - name: Install via install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WHICHSHELL_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          .\install.ps1
          & "$env:RUNNER_TEMP\bin\whichshell.cmd"

      - name: Smoke test whichshell from cmd.exe (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python whichshell
